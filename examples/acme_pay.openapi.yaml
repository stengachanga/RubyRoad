openapi: 3.1.0
info:
  title: Acme Pay API
  version: 1.2.0
  description: |
    Acme Pay is a fictional card-acquiring API used to demonstrate RubyRoad.
    Amounts are always integer minor units (cents) plus an ISO-4217 currency code.
    Never send floating-point numbers.
  contact:
    name: Acme Pay Developers
    url: https://docs.acmepay.test
  license:
    name: MIT
servers:
  - url: https://sandbox.acmepay.test/v1
    description: Sandbox (test cards, no real money)
  - url: https://api.acmepay.test/v1
    description: Live production
security:
  - bearerAuth: []
tags:
  - name: Payments
    description: Charge a payment method and retrieve payment state
  - name: Refunds
    description: Return funds for a captured payment
  - name: Customers
    description: Store payer identity for repeat charges
  - name: Webhooks
    description: Signed event delivery
paths:
  /payments:
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Create a payment
      description: |
        Authorize (and optionally capture) a card payment. Send an Idempotency-Key
        so retries do not double-charge.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
            example:
              amount: 2500
              currency: USD
              customer_id: cus_01J5ACME000000000000001
              description: "Order #1042"
              capture: true
              metadata:
                order_id: "1042"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
              example:
                id: pay_01J5ACME000000000000001
                object: payment
                amount: 2500
                currency: USD
                status: succeeded
                customer_id: cus_01J5ACME000000000000001
                description: "Order #1042"
                capture: true
                metadata:
                  order_id: "1042"
                created_at: "2026-08-29T14:00:00Z"
                failure_code: null
                failure_message: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Card was declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  type: card_error
                  code: card_declined
                  message: Your card was declined.
                  param: null
                  doc_url: https://docs.acmepay.test/errors/card_declined
      callbacks:
        paymentResult:
          "{$request.body#/metadata/webhook_override}":
            post:
              summary: Payment lifecycle callback
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/WebhookEvent"
                    example:
                      id: evt_01J5ACME000000000000010
                      type: payment.succeeded
                      created_at: "2026-08-29T14:00:01Z"
                      data:
                        object:
                          id: pay_01J5ACME000000000000001
                          amount: 2500
                          currency: USD
                          status: succeeded
              responses:
                "200":
                  description: Merchant acknowledged the event
  /payments/{payment_id}:
    get:
      tags: [Payments]
      operationId: retrievePayment
      summary: Retrieve a payment
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
              example:
                id: pay_01J5ACME000000000000001
                object: payment
                amount: 2500
                currency: USD
                status: succeeded
                customer_id: cus_01J5ACME000000000000001
                description: "Order #1042"
                capture: true
                metadata:
                  order_id: "1042"
                created_at: "2026-08-29T14:00:00Z"
                failure_code: null
                failure_message: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /payments/{payment_id}/refunds:
    post:
      tags: [Refunds]
      operationId: createRefund
      summary: Refund a payment
      description: Refund all or part of a succeeded payment. Partial refunds use amount in cents.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
            example:
              amount: 2500
              reason: requested_by_customer
      responses:
        "201":
          description: Refund created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
              example:
                id: re_01J5ACME000000000000001
                object: refund
                payment_id: pay_01J5ACME000000000000001
                amount: 2500
                currency: USD
                status: succeeded
                reason: requested_by_customer
                created_at: "2026-08-29T14:05:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Payment is not refundable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  type: invalid_request
                  code: payment_not_refundable
                  message: Only succeeded payments can be refunded.
                  param: payment_id
                  doc_url: https://docs.acmepay.test/errors/payment_not_refundable
  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List customers
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10
        - name: starting_after
          in: query
          schema:
            type: string
          description: Cursor (a customer id) for pagination
          example: cus_01J5ACME000000000000000
      responses:
        "200":
          description: A page of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
              example:
                object: list
                has_more: false
                data:
                  - id: cus_01J5ACME000000000000001
                    object: customer
                    email: ada@example.com
                    name: Ada Lovelace
                    metadata: {}
                    created_at: "2026-08-20T09:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
            example:
              email: ada@example.com
              name: Ada Lovelace
              metadata:
                account: "42"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
              example:
                id: cus_01J5ACME000000000000001
                object: customer
                email: ada@example.com
                name: Ada Lovelace
                metadata:
                  account: "42"
                created_at: "2026-08-20T09:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
webhooks:
  paymentSucceeded:
    post:
      tags: [Webhooks]
      operationId: webhookPaymentSucceeded
      summary: payment.succeeded
      description: |
        Fired after a payment captures successfully.
        Signed with HMAC-SHA256. Header:
        `X-Acme-Signature: t=<unix_timestamp>,v1=<hex_digest>`
        Signed payload is `"#{timestamp}.#{raw_body}"` using the webhook secret.
      parameters:
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
            example:
              id: evt_01J5ACME000000000000010
              object: event
              type: payment.succeeded
              created_at: "2026-08-29T14:00:01Z"
              data:
                object:
                  id: pay_01J5ACME000000000000001
                  amount: 2500
                  currency: USD
                  status: succeeded
      responses:
        "200":
          description: Event received
  paymentFailed:
    post:
      tags: [Webhooks]
      operationId: webhookPaymentFailed
      summary: payment.failed
      description: |
        Fired when authorization or capture fails.
        HMAC-SHA256 header `X-Acme-Signature: t=<unix>,v1=<hex>`.
      parameters:
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
            example:
              id: evt_01J5ACME000000000000011
              object: event
              type: payment.failed
              created_at: "2026-08-29T14:00:02Z"
              data:
                object:
                  id: pay_01J5ACME000000000000002
                  amount: 2500
                  currency: USD
                  status: failed
                  failure_code: card_declined
      responses:
        "200":
          description: Event received
  refundCompleted:
    post:
      tags: [Webhooks]
      operationId: webhookRefundCompleted
      summary: refund.completed
      description: |
        Fired when a refund settles.
        HMAC-SHA256 header `X-Acme-Signature: t=<unix>,v1=<hex>`.
      parameters:
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
            example:
              id: evt_01J5ACME000000000000012
              object: event
              type: refund.completed
              created_at: "2026-08-29T14:05:01Z"
              data:
                object:
                  id: re_01J5ACME000000000000001
                  payment_id: pay_01J5ACME000000000000001
                  amount: 2500
                  currency: USD
                  status: succeeded
      responses:
        "200":
          description: Event received
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: |
        Secret API key. Sandbox keys start with `sk_test_`. Live keys start with `sk_live_`.
        Send as `Authorization: Bearer sk_test_...`.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Alternate API key header if Bearer is inconvenient.
  parameters:
    PaymentId:
      name: payment_id
      in: path
      required: true
      description: Payment identifier (`pay_...`)
      schema:
        type: string
      example: pay_01J5ACME000000000000001
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Unique key that makes a write retry-safe for 24 hours.
        Required for payments and refunds in live mode.
      schema:
        type: string
        maxLength: 255
      example: req_01J5IDEMPOTENCY0000001
    WebhookSignature:
      name: X-Acme-Signature
      in: header
      required: true
      description: |
        HMAC-SHA256 signature of `"#{timestamp}.#{raw_body}"`.
        Format: `t=<unix_timestamp>,v1=<hex_digest>`.
      schema:
        type: string
      example: t=1788012000,v1=0123456789abcdef
  responses:
    BadRequest:
      description: The request was malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              type: invalid_request
              code: parameter_invalid
              message: amount must be a positive integer (minor units).
              param: amount
              doc_url: https://docs.acmepay.test/errors/parameter_invalid
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              type: authentication_error
              code: invalid_api_key
              message: Invalid API key provided.
              param: null
              doc_url: https://docs.acmepay.test/errors/invalid_api_key
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              type: invalid_request
              code: resource_missing
              message: No such payment.
              param: payment_id
              doc_url: https://docs.acmepay.test/errors/resource_missing
  schemas:
    Payment:
      type: object
      description: A card payment (authorization + optional capture)
      required: [id, amount, currency, status]
      properties:
        id:
          type: string
          example: pay_01J5ACME000000000000001
        object:
          type: string
          enum: [payment]
        amount:
          type: integer
          description: Amount in minor units (cents). Never a float.
          example: 2500
          minimum: 1
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: USD
        status:
          type: string
          enum: [pending, requires_action, succeeded, failed, canceled]
          example: succeeded
        customer_id:
          type: string
          nullable: true
          example: cus_01J5ACME000000000000001
        description:
          type: string
          nullable: true
        capture:
          type: boolean
          default: true
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        failure_code:
          type: string
          nullable: true
        failure_message:
          type: string
          nullable: true
      example:
        id: pay_01J5ACME000000000000001
        object: payment
        amount: 2500
        currency: USD
        status: succeeded
        customer_id: cus_01J5ACME000000000000001
        description: "Order #1042"
        capture: true
        metadata:
          order_id: "1042"
        created_at: "2026-08-29T14:00:00Z"
        failure_code: null
        failure_message: null
    CreatePaymentRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Integer minor units (cents). Do not send 19.99.
          minimum: 1
          example: 2500
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: USD
        customer_id:
          type: string
          example: cus_01J5ACME000000000000001
        description:
          type: string
          example: "Order #1042"
        capture:
          type: boolean
          default: true
        metadata:
          type: object
          additionalProperties:
            type: string
    Refund:
      type: object
      description: A refund against a payment
      required: [id, payment_id, amount, currency, status]
      properties:
        id:
          type: string
          example: re_01J5ACME000000000000001
        object:
          type: string
          enum: [refund]
        payment_id:
          type: string
          example: pay_01J5ACME000000000000001
        amount:
          type: integer
          description: Refunded amount in minor units
          example: 2500
        currency:
          type: string
          example: USD
        status:
          type: string
          enum: [pending, succeeded, failed]
          example: succeeded
        reason:
          type: string
          enum: [duplicate, fraudulent, requested_by_customer]
        created_at:
          type: string
          format: date-time
    CreateRefundRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          description: Amount to refund in minor units. Omit-not-allowed; send the original amount for a full refund.
          minimum: 1
          example: 2500
        reason:
          type: string
          enum: [duplicate, fraudulent, requested_by_customer]
          example: requested_by_customer
    Customer:
      type: object
      description: A stored customer
      required: [id, email]
      properties:
        id:
          type: string
          example: cus_01J5ACME000000000000001
        object:
          type: string
          enum: [customer]
        email:
          type: string
          format: email
          example: ada@example.com
        name:
          type: string
          example: Ada Lovelace
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
    CreateCustomerRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: ada@example.com
        name:
          type: string
          example: Ada Lovelace
        metadata:
          type: object
          additionalProperties:
            type: string
    CustomerList:
      type: object
      required: [data]
      properties:
        object:
          type: string
          enum: [list]
        has_more:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
    WebhookEvent:
      type: object
      description: Signed webhook envelope
      required: [id, type]
      properties:
        id:
          type: string
          example: evt_01J5ACME000000000000010
        object:
          type: string
          enum: [event]
        type:
          type: string
          enum:
            - payment.succeeded
            - payment.failed
            - refund.completed
          example: payment.succeeded
        created_at:
          type: string
          format: date-time
        data:
          type: object
          properties:
            object:
              type: object
              additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
              enum: [invalid_request, authentication_error, card_error, api_error]
            code:
              type: string
            message:
              type: string
            param:
              type: string
              nullable: true
            doc_url:
              type: string
              format: uri
